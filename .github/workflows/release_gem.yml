on:
  workflow_dispatch:

jobs:
  release:
    # By owner rather than by name, so that the job keeps running if the
    # repository is renamed; forks skip it either way.
    if: github.repository_owner == 'unasuke'
    runs-on: ubuntu-latest

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/http3

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ruby

      # Deliberately without bundler-cache, which installs into ./vendor/bundle.
      # vendor/ is not gitignored, so the untracked tree would trip
      # release:guard_clean further down; BUNDLE_FROZEN keeps this install from
      # rewriting Gemfile.lock, which would trip it too.
      - name: Install host gems
        run: BUNDLE_FROZEN=true bundle install

      # Makes the build: :compile dependency of rake release a no-op, so that
      # the build runs before release-gem asks for a trusted publishing API
      # key, which expires 15 minutes after it is issued.
      - name: Compile extension on host
        run: bundle exec rake compile

      # Tags from lib/http3/version.rb, pushes the gem. The gem is source
      # only; there is no precompiled platform gem to build or push alongside it.
      - uses: rubygems/release-gem@v1.4.1

      - name: Create GitHub release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"
          gh release create "${tag_name}" --verify-tag --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

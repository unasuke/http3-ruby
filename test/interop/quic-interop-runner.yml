# quic-interop-runner's docker-compose.yml with the stand-in simulator
# (sim/Dockerfile) in place of the ns-3 one. run_interop_runner.sh copies it
# into the runner's clone and runs the runner on it.
#
# The rest follows the runner's compose: the client on leftnet, the server
# on rightnet, the simulator at .2 on both, as the endpoints' setup.sh
# routes through it, and the addresses trace.py fixes. Two things are left
# out: `interface_name`, which needs Docker Engine 28.1 and which podman
# refuses, and the endpoints' `memlock` ulimit, which rootless podman cannot
# raise above its own. The iperf services are left out too: they serve the
# measurements, which http3-ruby does not take part in.

services:
  sim:
    image: http3-ruby-interop-sim
    container_name: sim
    hostname: sim
    stdin_open: true
    tty: true
    environment:
      - WAITFORSERVER=$WAITFORSERVER
      - SCENARIO=$SCENARIO
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    expose:
      - "57832"
    networks:
      leftnet:
        ipv4_address: 193.167.0.2
        ipv6_address: fd00:cafe:cafe:0::2
      rightnet:
        ipv4_address: 193.167.100.2
        ipv6_address: fd00:cafe:cafe:100::2
    extra_hosts:
      - "server:193.167.100.100"

  server:
    image: $SERVER
    container_name: server
    hostname: server
    stdin_open: true
    tty: true
    volumes:
      - $SERVER_WWW:/www:ro
      - $SERVER_DOWNLOADS:/downloads:delegated
      - $CERTS:/certs:ro
    environment:
      - CRON=$CRON
      - ROLE=server
      - SERVER_PARAMS=$SERVER_PARAMS
      - SSLKEYLOGFILE=/logs/keys.log
      - QLOGDIR=/logs/qlog/
      - TESTCASE=$TESTCASE_SERVER
      - REQUESTS=$REQUESTS_SERVER
      - PROTOCOLS=$PROTOCOLS_SERVER
    depends_on:
      - sim
    cap_add:
      - NET_ADMIN
    networks:
      rightnet:
        ipv4_address: 193.167.100.100
        ipv6_address: fd00:cafe:cafe:100::100
    extra_hosts:
      - "server4:193.167.100.100"
      - "server6:fd00:cafe:cafe:100::100"

  client:
    image: $CLIENT
    container_name: client
    hostname: client
    stdin_open: true
    tty: true
    volumes:
      - $CLIENT_WWW:/www:ro
      - $CLIENT_DOWNLOADS:/downloads:delegated
      - $CERTS:/certs:ro
    environment:
      - CRON=$CRON
      - ROLE=client
      - CLIENT_PARAMS=$CLIENT_PARAMS
      - SSLKEYLOGFILE=/logs/keys.log
      - QLOGDIR=/logs/qlog/
      - TESTCASE=$TESTCASE_CLIENT
      - REQUESTS=$REQUESTS_CLIENT
      - PROTOCOLS=$PROTOCOLS_CLIENT
    depends_on:
      - sim
    cap_add:
      - NET_ADMIN
    networks:
      leftnet:
        ipv4_address: 193.167.0.100
        ipv6_address: fd00:cafe:cafe:0::100
    extra_hosts:
      - "server4:193.167.100.100"
      - "server6:fd00:cafe:cafe:100::100"
      - "server46:193.167.100.100"
      - "server46:fd00:cafe:cafe:100::100"

networks:
  leftnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    enable_ipv6: true
    ipam:
      config:
        - subnet: 193.167.0.0/24
        - subnet: fd00:cafe:cafe:0::/64
  rightnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    enable_ipv6: true
    ipam:
      config:
        - subnet: 193.167.100.0/24
        - subnet: fd00:cafe:cafe:100::/64
